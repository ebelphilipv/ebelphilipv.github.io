<style>
/* Final build of v4b Dither Frames, with the chosen tweak settings built in */
:root{
  --w:#FFFFFF; --off:#F4F4F1; --k:#0A0A0A; --k2:#5E5E5A; --hl:#B6FF3B;
  --disp:"Bricolage Grotesque",sans-serif; --mono:"Geist Mono",monospace; --px:"Silkscreen",monospace;
  --hs:1; --fs:14.5px; --rd:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--w);color:var(--k);font:400 var(--fs)/1.65 var(--mono);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;height:auto;display:block}
.px{font:400 11px var(--px);letter-spacing:.04em;text-transform:uppercase}
mark{background:var(--hl);color:var(--k);padding:0 .15em}
.wrap{max-width:1280px;margin:0 auto;border-left:1px solid var(--k);border-right:1px solid var(--k)}
@media (max-width:1300px){.wrap{border-left:0;border-right:0}}

.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--k);padding:10px 20px;gap:12px;position:sticky;top:0;background:var(--w);z-index:5}
.bar .id{display:flex;gap:10px;align-items:center}
.bar .sq{width:14px;height:14px;background:var(--k);box-shadow:4px 4px 0 var(--hl)}
.bar nav{display:flex;gap:4px}
.bar nav a{text-decoration:none;padding:4px 8px}
.bar nav a:hover{background:var(--k);color:var(--w)}
@media (max-width:760px){.bar nav{display:none}}

.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font:500 13px var(--mono);padding:11px 16px;border:1px solid var(--k);text-decoration:none;transition:box-shadow .15s,transform .15s}
.btn.p{background:var(--k);color:var(--w)}
.btn:hover{box-shadow:4px 4px 0 var(--hl);transform:translate(-2px,-2px)}

/* hero — fills the first screen; the image dissolves into the page on its left and bottom edges */
.hero{display:grid;grid-template-columns:1fr 1.1fr;min-height:calc(100vh - 52px);min-height:calc(100svh - 52px)}
.hero-t{padding:56px 40px 40px;display:flex;flex-direction:column;justify-content:center;gap:28px;position:relative;z-index:1}
h1{font:800 calc(clamp(60px,8.4vw,124px) * var(--hs))/.9 var(--disp);letter-spacing:-.035em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
h1 .ln>span{display:inline-block}
.hero-t p{font-size:16px;max-width:36em}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-v{position:relative;display:flex;flex-direction:column;min-height:420px}
.hero-v .stage{flex:1;position:relative;overflow:hidden}
.hero-v canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hero-v .tagbox{position:absolute;top:16px;right:16px;background:var(--hl);padding:4px 8px;z-index:1}
.hero-v .cap{display:flex;justify-content:space-between;padding:8px 14px;gap:10px;color:var(--k2)}
.readout{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--k)}
.readout div{padding:10px 14px;border-right:1px solid var(--k)}
.readout div:last-child{border-right:0}
.readout span{display:block;color:var(--k2)}
@media (max-width:900px){.hero{grid-template-columns:1fr;min-height:0}.hero-t{padding:36px 16px 8px}.hero-v{min-height:0}.hero-v .stage{aspect-ratio:4/3;flex:none}.readout{grid-template-columns:1fr 1fr}.readout div:nth-child(2){border-right:0}.readout div:nth-child(-n+2){border-bottom:1px solid var(--k)}}

/* dithered band: paper fades to ink so the hero runs into the black ticker without a hard cut */
.band{display:block;width:100%;height:56px;image-rendering:pixelated}
body.no-band .band{display:none}
.ticker{border-bottom:1px solid var(--k);overflow:hidden;white-space:nowrap;background:var(--k);color:var(--w)}
.ticker div{display:inline-block;padding:9px 0;animation:tick 40s linear infinite}
.ticker span{margin:0 28px}
.ticker b{color:var(--hl);font-weight:500}
@keyframes tick{to{transform:translateX(-50%)}}
body.no-ticker .ticker{display:none}
body.no-ticker .band{display:none}

.sec{border-bottom:1px solid var(--k)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--k);background:var(--off);gap:12px}
.sh h2{font:800 22px var(--disp);letter-spacing:-.01em}
.inner{padding:40px}
@media (max-width:760px){.inner{padding:24px 16px}.sh{padding:10px 16px}}

.about{display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
.about h3{font:800 calc(46px * var(--hs))/.95 var(--disp);letter-spacing:-.03em}
.about .t{display:grid;gap:14px;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--k);padding:3px 8px;font-size:12px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);margin-top:36px;border:1px solid var(--k)}
.pipe div{padding:14px 16px;border-right:1px solid var(--k)}
.pipe div:last-child{border-right:0}
.pipe b{font:800 24px var(--disp);display:block}
.pipe span{color:var(--k2);font-size:12.5px}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:18px}.about h3{font-size:calc(36px * var(--hs))}.pipe{grid-template-columns:1fr 1fr}.pipe div:nth-child(2){border-right:0}.pipe div:nth-child(-n+2){border-bottom:1px solid var(--k)}}

.stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--k)}
.stats div{padding:16px 18px;border-right:1px solid var(--k);border-bottom:1px solid var(--k)}
.stats div:nth-child(2n){border-right:0}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats b{font:800 calc(28px * var(--hs))/1 var(--disp);letter-spacing:-.02em;display:block;margin-bottom:6px}
.stats p{font-size:12px;color:var(--k2);line-height:1.45}
@media (max-width:600px){.stats{grid-template-columns:1fr}.stats div{border-right:0}.stats div:nth-last-child(2){border-bottom:1px solid var(--k)}}
.minors{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--k)}
.minors article{padding:28px;border-right:1px solid var(--k)}
.minors article:last-child{border-right:0}
.minors h3{font:800 26px/1.05 var(--disp);letter-spacing:-.02em;margin:6px 0 10px}
.minors p{margin-bottom:14px;color:var(--k2)}
@media (max-width:760px){.minors{grid-template-columns:1fr}.minors article{border-right:0;border-bottom:1px solid var(--k);padding:20px 16px}}

.jobs article{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:24px 0;border-bottom:1px dashed var(--k2)}
.jobs article:first-child{padding-top:0}
.jobs article:last-child{border-bottom:0;padding-bottom:0}
.jobs h3{font:800 26px/1.05 var(--disp);letter-spacing:-.02em}
.jobs .px{color:var(--k2);display:block;margin-top:6px}
.jobs ul{list-style:none;display:grid;gap:7px}
.jobs li{padding-left:18px;position:relative}
.jobs li::before{content:"→";position:absolute;left:0}
@media (max-width:760px){.jobs article{grid-template-columns:1fr;gap:10px}}

.matrix{width:100%;border-collapse:collapse}
.matrix th,.matrix td{border:1px solid var(--k);padding:10px 14px;text-align:left;vertical-align:top}
.matrix th{width:240px;background:var(--off);font:800 17px var(--disp)}
.matrix td span{display:inline-block;margin:2px 4px 2px 0;padding:1px 6px;border:1px solid var(--k);font-size:12.5px}
@media (max-width:600px){.matrix th{width:auto;display:block;border-bottom:0}.matrix td{display:block}}

.edu{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--k)}
.edu div{padding:24px;border-right:1px solid var(--k)}
.edu div:last-child{border-right:0}
.edu h3{font:800 22px/1.1 var(--disp);letter-spacing:-.01em;margin:8px 0 6px}
.edu p{color:var(--k2);font-size:13.5px}
@media (max-width:900px){.edu{grid-template-columns:1fr}.edu div{border-right:0;border-bottom:1px solid var(--k)}}

.contact{display:grid;grid-template-columns:1.3fr 1fr}
.contact .l{padding:56px 40px;border-right:1px solid var(--k)}
.contact h2{font:800 calc(clamp(44px,6vw,84px) * var(--hs))/.9 var(--disp);letter-spacing:-.035em}
.contact p{margin:16px 0 26px;max-width:42ch}
.contact dl div{display:grid;grid-template-columns:100px 1fr;padding:18px 24px;border-bottom:1px solid var(--k);gap:12px}
.contact dl div:last-child{border-bottom:0}
.contact dt{color:var(--k2);padding-top:3px}
.contact dd{font:500 15px var(--mono);word-break:break-word}
.contact dd a{text-decoration:none;background:linear-gradient(var(--hl),var(--hl)) 0 100%/0 40% no-repeat;transition:background-size .25s}
.contact dd a:hover{background-size:100% 40%}
@media (max-width:900px){.contact{grid-template-columns:1fr}.contact .l{border-right:0;border-bottom:1px solid var(--k);padding:36px 16px}.contact dl div{padding:14px 16px}}
footer{display:flex;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--k)}

/* project index + full-screen frames */
.idx{width:100%;border-collapse:collapse}
.idx th,.idx td{text-align:left;padding:12px 20px;border-bottom:1px solid var(--k);vertical-align:middle}
.idx th{background:var(--off);font:400 11px var(--px);text-transform:uppercase}
.idx tr.row{cursor:pointer;transition:background .15s}
.idx tr.row:hover{background:var(--hl)}
.idx td:first-child{font:800 22px var(--disp);width:70px}
.idx td.t{font:800 19px/1.15 var(--disp);letter-spacing:-.01em}
.idx td.k{color:var(--k2);font-size:12.5px}
.idx td.v{font:800 19px var(--disp);white-space:nowrap}
.idx td.go{width:40px;text-align:right}
@media (max-width:900px){.idx .k,.idx th.k{display:none}}
@media (max-width:600px){.idx .v,.idx th.v{display:none}.idx th,.idx td{padding:10px 12px}}

.frame{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;border-bottom:1px solid var(--k)}
.frame .vis{border-right:1px solid var(--k);display:flex;flex-direction:column;background:var(--w);position:relative}
.frame .vis .cvs{flex:1;display:flex;flex-direction:column;justify-content:center}
.frame .vis .cv{padding:56px 28px 16px;border-bottom:1px dashed var(--k2)}
.frame .vis .cv:last-child{border-bottom:0}
.frame .vis .cv+.cv{padding-top:24px}
.frame .vis .dz{position:relative;cursor:crosshair}
.frame .vis canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.frame .vis .orig{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .35s steps(3)}
body.f-hover .frame .vis .dz:hover .orig,body.f-orig .frame .vis .orig{opacity:1}
body.f-orig .frame .vis .dz{cursor:default}
.frame .vis figcaption{margin-top:10px;color:var(--k2);text-transform:none;font-size:10px}
.frame .vis .bar2{display:flex;justify-content:space-between;border-top:1px solid var(--k);padding:8px 14px;gap:10px}
.frame .no{position:absolute;top:14px;left:14px;background:var(--k);color:var(--w);padding:4px 10px;font:800 20px var(--disp);z-index:1}
.frame.feat .no{background:var(--hl);color:var(--k)}
.frame .txt{display:flex;flex-direction:column;min-width:0}
.frame .txt .hd{padding:28px 28px 22px;border-bottom:1px solid var(--k)}
.frame .txt h3{font:800 calc(clamp(26px,2.6vw,36px) * var(--hs))/1.02 var(--disp);letter-spacing:-.02em;margin:8px 0 12px}
.frame .txt .hd p{font-size:13.5px}
.frame details{border-bottom:1px solid var(--k)}
.frame summary{list-style:none;cursor:pointer;padding:14px 28px;display:flex;justify-content:space-between}
.frame summary::-webkit-details-marker{display:none}
.frame summary::after{content:"[+]"}
.frame details[open] summary::after{content:"[–]"}
.frame summary:hover{background:var(--hl)}
.frame details ul{list-style:none;display:grid;gap:7px;padding:0 28px 18px}
.frame details li{padding-left:18px;position:relative;font-size:13.5px}
.frame details li::before{content:"▪";position:absolute;left:0}
.frame .chips{padding:18px 28px;margin-top:auto}
@media (max-width:1000px){.frame{grid-template-columns:1fr;min-height:0}.frame .vis{border-right:0;border-bottom:1px solid var(--k)}.frame .vis .cv{padding:48px 16px 16px}.frame .txt .hd{padding:20px 16px}.frame summary{padding:12px 16px}.frame details ul{padding:0 16px 16px}.frame .chips{padding:16px}}

/* motion: heavy (weighted, slow), snappy (stepped 1-bit), off */
[data-reveal]{opacity:0}
[data-reveal].in{opacity:1;transform:none}
body.m-heavy [data-reveal]{transform:translateY(var(--rd));transition:opacity 1.1s cubic-bezier(.2,.7,.1,1),transform 1.3s cubic-bezier(.2,.7,.1,1)}
body.m-snappy [data-reveal]{transform:translateY(calc(var(--rd) / 2));transition:opacity .5s steps(4),transform .5s steps(4)}
body.m-off [data-reveal]{opacity:1;transform:none;transition:none}
body.m-off .ticker div{animation:none}
.intro h1 .ln>span{transform:translateY(105%)}
.intro .hero-t .px,.intro .hero-t p,.intro .cta,.intro .readout>div,.intro .hero-v .cap,.intro .tagbox{opacity:0}
.loaded h1 .ln>span{transform:none;transition:transform 1.25s cubic-bezier(.16,.84,.24,1)}
.loaded h1 .ln:nth-child(2)>span{transition-delay:.16s}
.loaded .hero-t .px,.loaded .hero-t p,.loaded .cta,.loaded .readout>div,.loaded .hero-v .cap,.loaded .tagbox{opacity:1;transition:opacity .9s ease}
.loaded .hero-t p{transition-delay:.55s}.loaded .cta{transition-delay:.75s}.loaded .tagbox{transition-delay:1.2s}
.loaded .readout>div:nth-child(1){transition-delay:1.3s}.loaded .readout>div:nth-child(2){transition-delay:1.42s}.loaded .readout>div:nth-child(3){transition-delay:1.54s}.loaded .readout>div:nth-child(4){transition-delay:1.66s}
.loaded .hero-v .cap{transition-delay:1.4s}
@media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1!important;transform:none!important}.ticker div{animation:none}.intro h1 .ln>span{transform:none}.intro .hero-t *,.intro .readout>div{opacity:1}}

</style>
</head>

window.PFh = {
  asset: name => (window.PF_ASSETS || {})[name] || "assets/" + name,
  esc: s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])),
  img: (f, cls = "") => `<img class="${cls}" src="${PFh.asset(f.src)}" width="${f.w}" height="${f.h}" alt="${PFh.esc(f.cap)}" loading="lazy">`,
  // 1-bit dither of an image into a canvas.
  // opts: ink, paper, hot (colour for the brightest warm pixels, or null), cell (dot size in px),
  //       crop [x, y, w, h] as fractions, invert (dither light areas instead of dark),
  //       algo "bayer8" | "bayer4" | "fs" (Floyd–Steinberg), gamma (>1 lightens),
  //       fadeBottom / fadeLeft (fraction of the image that dissolves to paper at that edge),
  //       reveal (ms for a top-to-bottom scan-in; 0 draws at once)
  _imgs: {},
  dither(canvas, src, opts = {}) {
    const o = Object.assign({ ink: "#0A0A0A", paper: "#FFFFFF", hot: null, cell: 3, crop: [0, 0, 1, 1], invert: false, algo: "bayer8", gamma: 1, fadeBottom: 0, fadeLeft: 0, reveal: 0 }, opts);
    const job = (canvas._job = (canvas._job || 0) + 1);   // a newer call cancels an older scan-in
    const draw = img => {
      if (job !== canvas._job) return;
      const [cx, cy, cw, ch] = o.crop, sw = img.width * cw, sh = img.height * ch;
      if (!canvas.dataset.fixed) { canvas.width = Math.min(1200, Math.round(sw)); canvas.height = Math.round(canvas.width * sh / sw); }
      const W = canvas.width, H = canvas.height, s = o.cell, w = Math.ceil(W / s), h = Math.ceil(H / s);
      const t = document.createElement("canvas"); t.width = w; t.height = h;
      const tc = t.getContext("2d"); tc.drawImage(img, img.width * cx, img.height * cy, sw, sh, 0, 0, w, h);
      let id; try { id = tc.getImageData(0, 0, w, h); } catch (err) {
        // opened from file:// — pixels can't be read, so fall back to a plain greyscale draw
        const c2 = canvas.getContext("2d"); c2.filter = "grayscale(1) contrast(1.4)"; c2.drawImage(img, img.width * cx, img.height * cy, sw, sh, 0, 0, W, H); return;
      }
      const d = id.data, L = new Float32Array(w * h), hotMask = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x, r = d[i*4], g = d[i*4+1], b = d[i*4+2];
        let lum = Math.pow((0.3 * r + 0.59 * g + 0.11 * b) / 255, 1 / o.gamma);
        if (o.invert) lum = 1 - lum;
        if (o.fadeBottom) { const f = (y / h - (1 - o.fadeBottom)) / o.fadeBottom; if (f > 0) lum += (1 - lum) * Math.min(1, f * f * (3 - 2 * f)); }
        if (o.fadeLeft) { const f = 1 - x / (w * o.fadeLeft); if (f > 0) lum += (1 - lum) * Math.min(1, f * f * (3 - 2 * f)); }
        L[i] = lum; hotMask[i] = o.hot && r > 200 && g > 150 && b < 120 ? 1 : 0;
      }
      const B8 = [0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21];
      const B4 = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
      const out = new Uint8Array(w * h);                 // 0 paper, 1 ink, 2 hot
      if (o.algo === "fs") {
        const E = Float32Array.from(L);
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const i = y * w + x, v = E[i], on = v < 0.5, err = v - (on ? 0 : 1);
          out[i] = on ? 1 : (hotMask[i] && L[i] > 0.55 ? 2 : 0);
          if (x + 1 < w) E[i+1] += err * 7 / 16;
          if (y + 1 < h) { if (x > 0) E[i+w-1] += err * 3 / 16; E[i+w] += err * 5 / 16; if (x + 1 < w) E[i+w+1] += err / 16; }
        }
      } else {
        const four = o.algo === "bayer4";
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const i = y * w + x, thr = four ? (B4[(y % 4) * 4 + (x % 4)] + 0.5) / 16 : (B8[(y % 8) * 8 + (x % 8)] + 0.5) / 64;
          out[i] = hotMask[i] && L[i] > thr * 0.9 ? 2 : L[i] < thr ? 1 : 0;
        }
      }
      const hex = c => { const n = parseInt(c.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
      const pal = [hex(o.paper), hex(o.ink), hex(o.hot || o.ink)];
      for (let i = 0; i < w * h; i++) { const c = pal[out[i]]; d[i*4] = c[0]; d[i*4+1] = c[1]; d[i*4+2] = c[2]; d[i*4+3] = 255; }
      tc.putImageData(id, 0, 0);
      const ctx = canvas.getContext("2d"); ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = o.paper; ctx.fillRect(0, 0, W, H);
      if (!o.reveal) { ctx.drawImage(t, 0, 0, w * s, h * s); return; }
      const t0 = performance.now();
      const step = now => {
        if (job !== canvas._job) return;
        const k = Math.min(1, (now - t0) / o.reveal), rows = Math.ceil(h * (1 - Math.pow(1 - k, 3)));
        ctx.drawImage(t, 0, 0, w, rows, 0, 0, w * s, rows * s);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    const cached = PFh._imgs[src];
    if (cached && cached.complete && cached.naturalWidth) return draw(cached);
    const img = cached || (PFh._imgs[src] = new Image());
    img.addEventListener("load", () => draw(img), { once: true });
    if (!cached) img.src = src;
  },
  reveal() {
    const els = document.querySelectorAll("[data-reveal]");
    if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
    els.forEach(e => io.observe(e));
  }
};

  cv.dataset.fixed = "1"; cv.width = Math.min(1200, Math.round(st.clientWidth)); cv.height = Math.round(cv.width / A);
  cv.setAttribute("aria-label", "1-bit dithered " + h.label.toLowerCase());
  document.getElementById("heroTag").textContent = `1-bit render · ${h.code}`;
  document.getElementById("heroCap").textContent = h.cap;
  document.getElementById("heroTool").textContent = h.tool;
  const wide = innerWidth > 900;
  PFh.dither(cv, PFh.asset(h.src), { ink: "#0A0A0A", paper: S.paper, hot: S.accent, cell: S.heroCell, crop: fitCrop(h, A), algo: S.algo,
    fadeBottom: S.fade ? 0.28 : 0, fadeLeft: S.fade && wide ? 0.22 : 0, reveal: animate && !reduced ? 1700 : 0 });
}
function drawFigs() {
  document.querySelectorAll(".frame canvas[data-src]").forEach(cv => PFh.dither(cv, PFh.asset(cv.dataset.src), { ink: "#0A0A0A", paper: S.paper, hot: S.accent, cell: S.figCell, algo: S.algo }));
}
// band: ordered-dither ramp from page colour to ink, leading into the black ticker
function drawBand() {
  const c = document.getElementById("band"), W = c.clientWidth || innerWidth, s = 3, H = 56;
  c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = S.paper; x.fillRect(0, 0, W, H); x.fillStyle = "#0A0A0A";
  const B = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for (let j = 0; j < H / s; j++) { const v = 1 - j / (H / s - 1); for (let i = 0; i < W / s; i++) if (v < (B[(j % 4) * 4 + (i % 4)] + 0.5) / 16) x.fillRect(i * s, j * s, s, s); }
}

/* ---------- heavy intro ---------- */
drawHero(true); drawFigs(); drawBand();
PFh.reveal();
const start = () => { void document.body.offsetWidth; document.body.classList.remove("intro"); document.body.classList.add("loaded"); };
// start once fonts are in, but never wait longer than 700 ms
let started = false; const go = () => { if (!started) { started = true; start(); } };
if (reduced) document.body.classList.remove("intro");
else { if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); setTimeout(go, 700); }
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawBand(); drawHero(false); }, 200); });
</script>
